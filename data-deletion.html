<h1>データ削除の手順</h1>
<p>アプリ「ai-shigoto-team」（AI仕事術ラボ／@life_hints.jp）は、運営者自身のアカウントの情報だけを扱い、ほかの利用者の個人情報は保存していません。</p>
<p>万一、あなたに関する情報の削除を希望される場合は、Instagramのダイレクトメッセージで @life_hints.jp に「データ削除希望」とお送りください。確認のうえ、30日以内に削除し、結果をお知らせします。</p>
<p>また、Facebookの［設定とプライバシー］→［設定］→［アプリとウェブサイト］から、このアプリとの連携をいつでも解除できます。</p>
